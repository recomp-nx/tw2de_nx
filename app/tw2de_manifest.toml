# The game (Xbox 360, title 4E4D0855, TW2; default.xex
# "game_x360.Release - Game LTCG.exe", XDK 2.0.21076, version 0.0.0.2, disc 1 of 2).
# The game's files are not part of this project: put default.xex from the disc and the title update's (TU1, disc 1)
# default.xexp in app/assets/. rexglue's loader applies "<xex>p" when it loads an xex (0.0.0.2 -> 0.0.1.2), for the
# code generator as at run time, so the code is generated from the updated game.
# No other modules (the import table names only xam.xex and xboxkrnl.exe).
[project]
name = "tw2de"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = ["overrides.toml"]
# Each function in its own file (generated/default/tw2de_recomp_<address>.cpp): a function's file and lines stay
# the same when others change, which keeps a GCC profile (PGO) valid for it. build_switch.py --batched turns it off.
one_function_per_file = true
# fctid / fctidz / fctiw through rex::ppc (diet_ops.h): PowerPC's rounding (FPSCR.RN). Game-independent (FNXF XIII).
fcti_inline = true
# rlwinm / rlwimi with an immediate shift and a mask that does not wrap as the plain shift / bit-field operation.
# Game-independent (FNXF XIII, sdk/tests/rotate_word_test.cpp).
rotate_word_shifts = true
# TW2 (2026-11-13): FNXF XIII's register-locals options (its notes: 11% fewer instructions on its hot functions, 18% with
# non_argument_as_local; about 60% fewer loads and stores of the context): r14-r31, f14-f31, the condition fields, CTR,
# XER and the lwarx reservation in C++ locals of each function, then r0, r2, r11, r12, f0 and v32-v63 too. Audited on
# this game's code (NOTES.md, "Register locals"):
#  - tools/non_argument_audit.py on the code without the options (the loop / leaf locals spelled back as ctx.X):
#    ENTRY 326 (the save/restore helpers and the SEH funclets' r12, the stack probe, the codec's vector functions that
#    take v32-v63 / v57-v62) and RET 33 (r11 from sub_82DB4780 / sub_82DB47B8 / sub_8287D5F0, the codec's v32-v63
#    around its register save and restore sub_830060E8 / sub_83006430; four `subfe rX,r11,r11`, independent of the
#    value): every function named there, caller and callee, is in non_argument_as_local_keep below (155).
#  - every lwarx and its stwcx. are in the same function (672 functions).
#  - no function reads a condition field or XER a callee would have to set; CTR only across the compiler's u64-to-double
#    helper sub_8286D430, which does not touch it (a local keeps it); setjmp (82DEA930) is replaced by the generator.
#  - the vector registers v14-v31 / v64-v127 stay in ctx as in FNXF XIII (the codec keeps tables in v64-v127 across
#    its functions: sub_830060E8 loads them).
# Off: delete these lines (a full rebuild either way: every generated file changes).
non_volatile_as_local = true
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
non_volatile_as_local_keep = ["v14-v31", "v64-v127"]
non_argument_as_local = true
